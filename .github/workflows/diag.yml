name: Diagnostika katastra
on:
  push:
    branches: [main]
    paths: [tools/diag_wfs.py]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet requests && mkdir -p dout && python3 tools/diag_wfs.py > dout/wfs.txt 2>&1 || true
      - run: |
          cd dout && git init -q -b diag && git config user.name gha && git config user.email gha@users.noreply.github.com && git add -A && git commit -q -m diag && git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" diag
