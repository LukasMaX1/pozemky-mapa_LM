name: Diagnostika stránok inzerátov
on:
  push:
    branches: [main]
    paths: [tools/dump_pages.py, tools/verify_listings.py]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - run: python3 tools/dump_pages.py
      - name: Uložiť do vetvy diag
        run: |
          cd out
          git init -q -b diag
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Diagnostika $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" diag
