name: Stiahnuť fotky pozemkov
on:
  push:
    branches: [main]
    paths: [data.json, tools/fetch_images.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fotky
  cancel-in-progress: true
jobs:
  fotky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python3 tools/fetch_images.py
      - name: Uložiť do vetvy img-cache
        run: |
          cd out
          git init -q -b img-cache
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Fotky $(date -u +%F)" || exit 0
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" img-cache
