<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pozemky Košice – mapa</title>
<meta name="theme-color" content="#2f6b45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f3f5f1;--surface:#fff;--fg:#1d2420;--muted:#5f6b63;--line:#d3dacf;--accent:#2f6b45;--ok:#2f7d4a;--warn:#a16207;--bad:#b4232c;--info:#2563a6}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--surface:#1a201d;--fg:#e4ebe6;--muted:#9aa79f;--line:#2f3833;--accent:#6fbf8a;--ok:#6fcf8e;--warn:#e3b341;--bad:#f2777f;--info:#7fb2ec}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--bg)}
#m{position:fixed;inset:0}
.bar{position:fixed;z-index:1000;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center;pointer-events:none}
.bar>*{pointer-events:auto}
.pill{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.title{flex:1;min-width:0}
.title b{display:block;font-size:15px}
.title span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:600 14px system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.fabs{position:fixed;z-index:1000;right:max(10px,env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.sheet{position:fixed;z-index:1100;left:0;right:0;bottom:0;max-height:62vh;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet[hidden]{display:none}
.sh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.sh b{font-size:16px}
.list{overflow:auto;padding:4px 0}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.num{width:26px;height:26px;border-radius:50%;color:#fff;font:600 12px ui-monospace,monospace;display:flex;align-items:center;justify-content:center}
.row .v{font-weight:600}
.row .s{font-size:12px;color:var(--muted)}
.row .p{font-weight:700;text-align:right;white-space:nowrap}
.pin{border-radius:50%;color:#fff;font:600 11px ui-monospace,monospace;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pin.dim{opacity:.55}
.pin.seen{border:3px solid #1d2420;box-shadow:0 0 0 2px #fff,0 1px 4px rgba(0,0,0,.45)}
.pin.r-no{opacity:.5}
.badge{position:absolute;right:-7px;top:-7px;width:16px;height:16px;border-radius:50%;background:#fff;font-size:10px;line-height:16px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.pinw{position:relative;width:26px;height:26px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0 4px}
.rate button{font:600 12px system-ui,sans-serif;border:1px solid #d3dacf;border-radius:8px;padding:6px 2px;background:#fff;color:#1d2420;cursor:pointer}
.rate button.on{color:#fff}
.rate .r-yes.on{background:#2f7d4a;border-color:#2f7d4a}.rate .r-maybe.on{background:#a16207;border-color:#a16207}.rate .r-no.on{background:#b4232c;border-color:#b4232c}.rate .r-hide.on{background:#5f6b63;border-color:#5f6b63}
.media{display:flex;gap:8px;align-items:center;margin:6px 0}
.strip{display:flex;gap:4px;overflow-x:auto;margin:6px 0;scrollbar-width:none}.strip img{height:80px;width:110px;object-fit:cover;border-radius:6px;display:block}
.media img{width:120px;height:84px;object-fit:cover;border-radius:8px;background:#e8ece5}
.media svg{width:96px;height:96px;flex:none;background:#f3f5f1;border-radius:8px}
.zhint{position:fixed;z-index:1000;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top));font-size:12px}
.zhint[hidden]{display:none}
.leaflet-popup-content{margin:12px 14px;min-width:220px}
.pp h3{margin:0 0 2px;font-size:16px}
.pp .t{color:#555;font-size:12px}
.pp .f{margin:6px 0;font-size:13px}
.pp .sum{font-size:12px;color:#444;margin:4px 0}
.pp .ln{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pp .ln a,.pp .ln button{font:600 12px system-ui,sans-serif;color:#2f6b45;text-decoration:none;border:1px solid #d3dacf;border-radius:7px;padding:4px 8px;background:#fff;cursor:pointer}
.pp .tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-right:4px}
.leg{font-size:11px;line-height:1.5}
.toast{position:fixed;z-index:1200;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#1d2420;color:#fff;border-radius:10px;padding:8px 14px;font-size:13px}
.toast[hidden]{display:none}
.leaflet-control-layers{font-size:13px}
/* detail pozemku */
.det{position:fixed;inset:0;z-index:1300;background:rgba(10,14,12,.55);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;overscroll-behavior:contain;padding:max(8px,env(safe-area-inset-top)) 0 max(8px,env(safe-area-inset-bottom))}
.det[hidden]{display:none}
.detin{background:var(--surface);width:min(820px,100%);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.dbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 10px 8px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.dbar b{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dgal{position:relative;background:#111}.dgal .gm{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:min(52vh,420px)}
.dgal .gm::-webkit-scrollbar{display:none}.dgal .gm img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:center}
.dgal .nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:22px}
.dgal .nav.l{left:8px}.dgal .nav.r{right:8px}.dgal .cnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font:600 12px ui-monospace,monospace;border-radius:6px;padding:2px 8px}
.thumbs{display:flex;gap:4px;overflow-x:auto;padding:6px;background:#111}.thumbs img{flex:0 0 auto;width:64px;height:48px;object-fit:cover;border-radius:5px;opacity:.55;border:2px solid transparent}.thumbs img.on{opacity:1;border-color:#fff}
.dbody{padding:12px 14px 18px;display:flex;flex-direction:column;gap:8px}
.dhead{display:flex;gap:10px;align-items:flex-start}.dhead .t{flex:1;min-width:0}.dhead h3{margin:0;font-size:19px}.dhead .sub{font-size:12.5px;color:var(--muted)}
.dpr{text-align:right}.dpr .p{font-size:18px;font-weight:700}.dpr .op{font-size:12px;color:var(--muted)}.dpr .op span{color:var(--ok);font-weight:700}
.sc{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 13px ui-monospace,monospace;border:2.5px solid currentColor}
.fl{font:13px ui-monospace,monospace}.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{font-size:11.5px;border-radius:999px;padding:0 8px;background:var(--bg);color:var(--muted)}
.chip.y{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}.chip.m{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}.chip.n{text-decoration:line-through}
.tags .tag{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:0 5px;margin:0 4px 4px 0}
.ki{font-size:12.5px;background:var(--bg);border-radius:8px;padding:6px 9px;line-height:1.5}
.dtext{font-size:14px;line-height:1.55;white-space:pre-line}
.dsec{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}
.drate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.drate button{font:600 13px system-ui,sans-serif;border:1px solid var(--line);border-radius:9px;padding:7px 4px;background:var(--surface);color:var(--fg)}
.drate button.on{color:#fff}.drate .r-yes.on{background:#2f7d4a}.drate .r-maybe.on{background:#a16207}.drate .r-no.on{background:#b4232c}.drate .r-hide.on{background:#5f6b63}
.dl{display:flex;flex-wrap:wrap;gap:6px}.dl a,.dl button{font:600 12.5px system-ui,sans-serif;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:var(--surface)}
.pf{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.pf .cand{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:5px}
.pf .cand b{font-family:ui-monospace,monospace}.pf .ok{color:var(--ok);font-weight:700}.pf .warn{color:var(--warn)}
.pff{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}.pff label{display:flex;flex-direction:column;font-size:11.5px;color:var(--muted);gap:2px}
.pff input,.pff select{font:14px system-ui,sans-serif;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg);min-width:0}
.pfh{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px;align-items:center}.pfh .chip{border:1px solid var(--line);cursor:pointer;font-weight:600;color:var(--accent)}
.pcp{position:fixed;z-index:1250;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));background:var(--surface);border:2px solid #f59e0b;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.3);padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-width:520px;margin:0 auto}
.pcp[hidden]{display:none}.pcp .r1{display:flex;align-items:center;gap:8px;justify-content:space-between}.pcp .r1 b{font-size:15px}.pcp .r2{display:flex;gap:6px;flex-wrap:wrap}
.pcp .btn{padding:8px 11px;font-size:13.5px}
.lbx{position:fixed;inset:0;z-index:1400;background:#000;display:flex;flex-direction:column}.lbx[hidden]{display:none}
.lbx .gm{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.lbx .gm img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:center}
.lbx button{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:2;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:700}
</style>
</head>
<body>
<div id="m"></div>
<div class="bar">
  <div class="pill title"><b>Pozemky Košice</b><span id="sub">Načítavam…</span></div>
  <a class="btn" id="appLink" href="https://claude.ai/artifact/GsnHdCBC455XFP5HD1rgrP" target="_blank" rel="noopener">Aplikácia</a>
</div>
<div class="fabs">
  <button class="btn" id="btnSync" type="button" hidden>↗ Preniesť do aplikácie</button>
  <button class="btn" id="btnMine" type="button" hidden>Skryté mnou: 0</button>
  <button class="btn" id="btnHidden" type="button">Vyradené: skryté</button>
  <button class="btn" id="btnLocate" type="button">📍 Kde som</button>
  <button class="btn pri" id="btnList" type="button">Zoznam</button>
</div>
<div class="sheet" id="sheet" hidden><div class="sh"><b id="shTitle">Pozemky</b><button class="btn" id="shClose" type="button">Zavrieť</button></div><div class="list" id="list"></div></div>
<div class="toast" id="toast" hidden></div>
<div class="det" id="det" hidden role="dialog" aria-modal="true" aria-label="Detail pozemku"><div class="detin" id="detIn"></div></div>
<div class="pcp" id="pcp" hidden></div>
<div class="lbx" id="lbx" hidden><button type="button" id="lbxX">Zavrieť ✕</button><div class="gm" id="lbxGm"></div></div>
<div class="pill zhint" id="zhint" hidden>Priblíž pre hranice parciel</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
const CENTER={lat:48.7206,lng:21.2575};
const DIRS={S:"Sever · Prešov/D1",V:"Východ · Bidovce/D1",J:"Juh · R4",Z:"Západ"};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function safeUrl(u){try{const x=new URL(u);return (x.protocol==="https:"||x.protocol==="http:")?x.href:null}catch(e){return null}}
function fmtEur(n){return n==null?"—":new Intl.NumberFormat("sk-SK",{maximumFractionDigits:0}).format(n)+" €"}
function fmtNum(n){return new Intl.NumberFormat("sk-SK",{maximumFractionDigits:0}).format(n)}

function norm(t){return String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim()}

function parseVillages(txt){
  const m={};
  String(txt||"").split(/\n|;/).forEach(line=>{
    const p=line.split(/[=:]/);if(p.length<2)return;
    const name=norm(p[0]);const v=norm(p.slice(1).join(":"));if(!name)return;
    const o=m[name]||{};
    if(/vyluc|exclude|nie/.test(v))o.exclude=true;
    if(/prefer|uprednost/.test(v))o.prefer=true;
    const n=parseInt(v,10);if(!isNaN(n))o.maxMin=n;
    m[name]=o;
  });
  return m;
}

function evaluate(p,st,vil){
  const parts=[];const flags=[];let hidden=null;
  const v=vil[norm(p.village)]||{};
  const dir=st.directions[p.direction]||null;
  // exclusions
  if(p.category==="nestavebny")hidden="nestavebný / investičný pozemok";
  else if(p.category==="rekreacny")hidden="rekreačný pozemok";
  if(p.upOk===false)hidden=hidden||"nie je v územnom pláne na výstavbu";
  if(p.shape==="úzky pás")hidden=hidden||"úzky pás (podľa inzerátu)";
  if(v.exclude)hidden=hidden||"obec je vylúčená v nastaveniach";
  if(dir&&!dir.on)hidden=hidden||"smer "+(DIRS[p.direction]||p.direction)+" je vypnutý";
  const lim=v.maxMin!=null?v.maxMin:(dir?dir.maxMin:30);
  const mf=minutesFor(p,st);const mins=mf.min;
  if(mins!=null&&mins>lim)hidden=hidden||("dojazd "+(mf.est?"~":"")+mins+" min > limit "+lim+" min");
  if(p.reserved&&!st.showReserved)hidden=hidden||"rezervované";
  const ratio=(p.width&&p.length)?Math.max(p.width,p.length)/Math.min(p.width,p.length):null;
  if(ratio!=null&&ratio>st.maxRatio)hidden=hidden||("úzky pás (pomer 1:"+ratio.toFixed(1)+")");
  if(st.terrain==="rovina"&&p.terrain&&p.terrain!=="rovina")hidden=hidden||"nie je rovinatý";

  // price 25
  let pp;const pmax=st.priceMax;
  if(p.price==null){pp=12;parts.push(["Cena","neuvedená",pp,25])}
  else if(p.price<=pmax){pp=25;parts.push(["Cena","v limite",pp,25])}
  else if(p.price<=pmax*1.05){pp=12;flags.push(["edge","cena na hrane"]);parts.push(["Cena","do +5 % nad limit",pp,25])}
  else if(p.price<=pmax*1.15){pp=5;flags.push(["edge","nad limitom"]);parts.push(["Cena","do +15 % nad limit",pp,25])}
  else{pp=0;flags.push(["edge","nad limitom"]);parts.push(["Cena","výrazne nad limitom",pp,25])}
  // area 20
  let ap;const a=p.area;
  if(a==null){ap=8;parts.push(["Výmera","neuvedená",ap,20])}
  else if(a>=st.areaMin&&a<=st.areaMax){ap=20;parts.push(["Výmera","v rozsahu",ap,20])}
  else{const d=a<st.areaMin?(st.areaMin-a)/st.areaMin:(a-st.areaMax)/st.areaMax;
    if(d<=.1){ap=12;parts.push(["Výmera","±10 % mimo rozsahu",ap,20])}
    else if(d<=.2){ap=5;parts.push(["Výmera","±20 % mimo rozsahu",ap,20])}
    else{ap=0;parts.push(["Výmera","mimo rozsahu",ap,20])}
    flags.push(["edge","výmera mimo"]);}
  // distance 15 + priority 5
  let dp;
  if(mins==null){dp=7;parts.push(["Dojazd","neznámy",dp,15])}
  else{const r=mins/lim;dp=r<=.6?15:r<=.85?12:r<=1?9:0;parts.push(["Dojazd",(mf.est?"~":"")+mins+" / "+lim+" min do: "+originOf(st).label,dp,15])}
  let pr=0;if(dir&&dir.priority)pr+=5;if(v.prefer){pr=5;flags.push(["pref","preferovaná obec"])}
  parts.push(["Smer / priorita",(DIRS[p.direction]||"—"),Math.min(pr,5),5]);
  // terrain 10
  const tp=p.terrain==="rovina"?10:p.terrain==="mierny svah"?5:p.terrain==="svah"?0:5;
  parts.push(["Terén",p.terrain||"neuvedený",tp,10]);
  // shape 15
  let sp;
  if(ratio==null){sp=7;parts.push(["Tvar","rozmery neuvedené",sp,15])}
  else{sp=ratio<=1.3?15:ratio<=1.7?12:ratio<=2?8:3;parts.push(["Tvar","pomer 1:"+ratio.toFixed(2),sp,15])}
  // utilities 10
  const u=p.utilities||{};const up=(u.elektrina?3:0)+(u.voda?3:0)+(u.kanalizacia?2:0)+(u.plyn?1:0)+(u.optika?1:0);
  parts.push(["Siete",Object.keys(u).filter(k=>u[k]).join(", ")||"neuvedené",up,10]);
  // main road
  let rp=0;if(p.mainRoad===true){rp=-3;parts.push(["Hlavná cesta","pri hlavnej ceste",rp,0])}
  const score=Math.max(0,Math.min(100,pp+ap+dp+Math.min(pr,5)+tp+sp+up+rp));
  if(p.reserved)flags.push(["res","rezervované"]);
  return {p,score,parts,flags,hidden,ratio,lim,mins,est:mf.est};
}


const KX=73.4, KY=111.2; // km per degree lng / lat around Košice
function toKm(lat,lng){return [(lng-CENTER.lng)*KX,(lat-CENTER.lat)*KY]}
function toLatLng(x,y){return {lat:CENTER.lat+y/KY,lng:CENTER.lng+x/KX}}
function originOf(st){const o=st.origin;return (o&&isFinite(o.lat)&&isFinite(o.lng))?o:{label:"centrum Košíc",lat:CENTER.lat,lng:CENTER.lng,isCenter:true}}
function originKey(o){return o.isCenter?"center":(+o.lat).toFixed(4)+","+(+o.lng).toFixed(4)}
function distKm(p,o){if(p.lat==null||p.lng==null)return null;const a=toKm(p.lat,p.lng),b=toKm(o.lat,o.lng);return Math.hypot(a[0]-b[0],a[1]-b[1])}
function minutesFor(p,st){
  const o=originOf(st);
  if(o.isCenter)return {min:p.minutes??null,est:false};
  if(p.minutesOrigin!=null&&p.originKey===originKey(o))return {min:p.minutesOrigin,est:false};
  const d=distKm(p,o);if(d==null)return {min:null,est:true};
  return {min:Math.round(4+(d*1.3)/(d>8?65:40)*60),est:true};
}

function scoreHex(s){return s>=75?"#2f7d4a":s>=55?"#2f6b45":s>=40?"#a16207":"#b4232c"}
function priceHex(p,max){if(p==null)return "#5f6b63";const r=p/max;return r<=.75?"#2f7d4a":r<=.95?"#2f6b45":r<=1.05?"#a16207":"#b4232c"}
const DEF={directions:{S:{maxMin:30,priority:true,on:true},V:{maxMin:30,priority:true,on:true},J:{maxMin:15,priority:false,on:true},Z:{maxMin:15,priority:false,on:true}},villages:"",areaMin:600,areaMax:900,priceMax:120000,terrain:"svah_ok",maxRatio:2.5,showReserved:true,count:15};
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2500)}

const ortoSR=L.tileLayer("https://ofmozaika.tiles.freemap.sk/{z}/{x}/{y}.jpg",{maxZoom:20,maxNativeZoom:19,attribution:"Ortofotomozaika SR © ÚGKK SR, NLC · freemap.sk"});

function parcelOf(p){const o=LS.get("pk-parcel",{})[p.id];if(o&&o.del)return null;if(o&&o.label)return o;return p.parcelFound||null}
function ringArea(r){let a=0;const k=Math.PI/180,R=6378137,lat0=r[0][1]*k;for(let i=0;i<r.length-1;i++){const x1=r[i][0]*k*R*Math.cos(lat0),y1=r[i][1]*k*R,x2=r[i+1][0]*k*R*Math.cos(lat0),y2=r[i+1][1]*k*R;a+=x1*y2-x2*y1}return Math.abs(a/2)}
function centroid(r){let x=0,y=0;r.forEach(c=>{x+=c[0];y+=c[1]});return [y/r.length,x/r.length]}
function parseWfs(txt){

  if(/^\s*\{/.test(txt)){const j=JSON.parse(txt);(j.features||[]).forEach(f=>{const pr=f.properties||{};let ring=null;const g=f.geometry;if(g){const c=g.type==="MultiPolygon"?g.coordinates[0][0]:g.type==="Polygon"?g.coordinates[0]:null;ring=c}
    const av=pr.areaValue&&typeof pr.areaValue==="object"?pr.areaValue.value:pr.areaValue;out.push({label:pr.label||pr.parcelNumber||"",ref:pr.nationalCadastralReference||pr.inspireId||"",area:av!=null?+av:null,ring})});return out}
  const x=new DOMParser().parseFromString(txt,"application/xml");
  const els=x.getElementsByTagNameNS("*","CadastralParcel");
  for(const el of els){const g=n=>{const e=el.getElementsByTagNameNS("*",n)[0];return e?e.textContent.trim():""};
    const pl=g("posList");let ring=null;if(pl){const v=pl.split(/\s+/).map(Number);ring=[];for(let i=0;i+1<v.length;i+=2)ring.push([v[i],v[i+1]])}
    out.push({label:g("label"),ref:g("nationalCadastralReference"),area:g("areaValue")?+g("areaValue"):null,ring})}
  return out}
function fixRing(r){if(!r||!r.length)return r;return r[0][0]>40?r.map(c=>[c[1],c[0]]):r} // [lng,lat]
function areaHints(p){const t=String((p.listingTitle||"")+" "+(p.title||"")+" "+(p.description||"")+" "+(p.summary||"")).replace(/\u00a0/g," ");const out=new Map();
  const add=(v,why)=>{v=Math.round(v);if(v>=150&&v<=30000&&!out.has(v))out.set(v,why)};
  if(p.area)add(p.area,"výmera z inzerátu");
  for(const m of t.matchAll(/(\d{1,3}(?:[ .]\d{3})+|\d{3,5})(?:[,.]\d+)?\s*(?:m2|m²|m\s?2\b|štvorcov)/gi))add(+m[1].replace(/[ .]/g,""),"spomenuté v texte");
  for(const m of t.matchAll(/(\d{1,3}(?:[,.]\d+)?)\s*(?:á|a)r(?:ov|y|e)?\b/gi)){const v=+m[1].replace(",",".");if(v>=1.5&&v<=300)add(v*100,"spomenuté v ároch")}
  if(p.width&&p.length)add(p.width*p.length,"šírka × dĺžka");
  return [...out.entries()]}
function labelHints(p){const t=String((p.description||"")+" "+(p.summary||""));const out=new Set();if(p.parcel)out.add(String(p.parcel));
  for(const m of t.matchAll(/(?:parc(?:ela|elné|\.)?\s*(?:č(?:\.|íslo)?)?|C-?KN|KN-?C|reg\.\s*C)\s*[:.]?\s*(?:C-?KN|KN-?C)?\s*(\d{1,5}\/\d{1,4})/gi))out.add(m[1]);return [...out]}

function pfOpts(){const g=id=>document.getElementById(id);return {area:+(g("pfArea")||{}).value||null,label:((g("pfLab")||{}).value||"").trim(),tol:+((g("pfTol")||{}).value||0.005),rad:(g("pfRad")||{}).value||"auto"}}
async function findParcel(p,o){
  o=o||{area:p.area,label:p.parcel||"",tol:0.005,rad:"auto"};const A=o.area;
  const res=document.getElementById("pfRes");if(!res)return;res.innerHTML='<div>Hľadám v katastri…</div>';
  const pr=p.precise&&p.check&&p.check.status==="overený";let dLat=pr?0.006:0.022,dLng=pr?0.009:0.032;
  if(o.rad!=="auto"){const km=+o.rad;dLat=km/111.2;dLng=km/73.4}
  if(!A&&!o.label){res.innerHTML='<div class="warn">Zadaj výmeru alebo číslo parcely.</div>';return}
  const bb=[p.lat-dLat,p.lng-dLng,p.lat+dLat,p.lng+dLng].map(v=>v.toFixed(5)).join(",")+",urn:ogc:def:crs:EPSG::4326";
  const base="https://inspirews.skgeodesy.sk/geoserver/cp/ows?service=WFS&version=2.0.0&request=GetFeature&typeNames=cp:CP.CadastralParcel&srsName=urn:ogc:def:crs:EPSG::4326&count=6000&bbox="+encodeURIComponent(bb);
  let feats=null,err="";
  for(const u of [base+"&outputFormat=application%2Fjson",base]){
    try{const r=await fetch(u);const t=await r.text();if(!r.ok){err="HTTP "+r.status;continue}feats=parseWfs(t);if(feats.length)break}catch(e){err=String(e&&e.message||e)}}
  if(!feats||!feats.length){res.innerHTML='<div class="warn">Kataster sa nepodarilo načítať ('+esc(err||"žiadne parcely")+'). Over parcelu ručne v ZBGIS – odkaz vyššie.</div>';return}
  feats.forEach(f=>{f.ring=fixRing(f.ring);if(f.area==null&&f.ring)f.area=Math.round(ringArea(f.ring))});
  const tol=A?Math.max(1,A*o.tol):0;
  const lab=String(o.label||"").replace(/^[^\d]*/,"");const labOf=f=>String(f.label).replace(/^[^\d]*/,"");
  let c=feats.filter(f=>f.ring&&((A&&f.area!=null&&Math.abs(f.area-A)<=tol)||(lab&&labOf(f)===lab)));
  c.forEach(f=>{const ce=centroid(f.ring);f.lat=ce[0];f.lng=ce[1];f.dist=Math.hypot((f.lat-p.lat)*111.2,(f.lng-p.lng)*73.4);f.match=!!lab&&labOf(f)===lab});
  c.sort((a,b)=>(b.match-a.match)||(A?Math.abs(a.area-A)-Math.abs(b.area-A):0)||(a.dist-b.dist));c=c.slice(0,10);
  if(!c.length){res.innerHTML='<div class="warn">V okolí ('+feats.length+' parciel) som nenašiel parcelu '+(A?'s výmerou '+esc(fmtNum(A))+' m² (±'+esc(fmtNum(Math.round(tol)))+' m²)':'')+(lab?(A?' ani ':'')+'s číslom '+esc(o.label):'')+'. Skús inú výmeru, väčšiu toleranciu alebo väčšie okolie. Pozemok môže vzniknúť delením väčšej parcely – over v ZBGIS.</div>';return}
  res.innerHTML='<div>'+(c.length===1?'Našla sa 1 parcela':'Kandidáti: '+c.length)+' (z '+feats.length+' parciel v okolí). Ťukni „Ukáž“ a over podľa fotiek a ortofota:</div>'+c.map((f,i)=>'<div class="cand"><b>'+esc(f.label||"?")+'</b><span>'+esc(fmtNum(f.area))+' m²</span><span style="color:var(--muted)">'+f.dist.toFixed(1)+' km od bodu</span>'+(f.match?'<span class="ok">číslo sedí</span>':'')+'<button class="btn" type="button" data-pc="'+i+'">Ukáž</button><button class="btn pri" type="button" data-ps="'+i+'">✔ Je to ona</button></div>').join("");
  PC={p,c,idx:0};
  res.onclick=ev=>{const s=ev.target.closest("[data-pc]"),k=ev.target.closest("[data-ps]");
    if(s){showCand(+s.dataset.pc)}
    if(k){confirmCand(+k.dataset.ps)}};
}

fetch("data.json?v="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>{
  const st=Object.assign({},DEF,j.settings||{});st.directions=Object.assign({},DEF.directions,(j.settings||{}).directions||{});
  D={st,plots:j.plots||[],generated:j.generated};mergeState();draw();fit();updSync();handleHash();
}).catch(err=>{document.getElementById("sub").textContent="Údaje sa nepodarilo načítať ("+err.message+")"});
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
